<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부서별 수익증대 실행계획</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#1c2430;--sub:#5b6676;--line:#dde2ea;--brand:#1f4fd8;--brand-soft:#e8eefc;
  --s1:#1f6feb;--s1b:#e6f0ff;--s2:#1a8f5a;--s2b:#e3f6ec;--s3:#c47a00;--s3b:#fff1d6;--ok:#13795b;--bad:#b42318;--warn:#fff8e1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c;--card:#1b212b;--ink:#e8ecf2;--sub:#9aa5b5;--line:#2d3644;--brand:#6c93ff;--brand-soft:#223056;
  --s1:#6aa6ff;--s1b:#1c2a44;--s2:#4fd18b;--s2b:#17342a;--s3:#f0b44c;--s3b:#3a2e12;--ok:#4fd18b;--bad:#ff8a80;--warn:#3a3214;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
header.top h1{font-size:17px;margin:0;flex:1 1 260px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--brand)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.layout{display:grid;grid-template-columns:200px 1fr;gap:20px;max-width:1280px;margin:0 auto;padding:18px 16px 80px}
nav.side{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;font-size:13px}
nav.side a{display:block;padding:4px 8px;color:var(--sub);text-decoration:none;border-radius:6px}
nav.side a:hover{background:var(--brand-soft);color:var(--brand)}
nav.side .grp{margin:10px 8px 2px;font-size:11px;color:var(--sub);letter-spacing:.04em}
section{margin-bottom:34px;scroll-margin-top:70px}
h2{font-size:20px;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.kpi .v{font-size:26px;font-weight:700;line-height:1.2}
.kpi .l{font-size:12px;color:var(--sub)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.stage{border-left:5px solid var(--c);background:var(--cb)}
.stage h3{margin:0 0 4px;font-size:16px;color:var(--c)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--brand-soft);font-size:12.5px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;background:var(--brand-soft)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.dept{margin-bottom:16px}
.dept header{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:8px}
.dept h3{margin:0;font-size:18px}
.tag{font-size:11.5px;background:var(--brand-soft);color:var(--brand);border-radius:99px;padding:1px 9px}
.eff{margin-left:auto;font-size:13px;color:var(--sub)}
.eff b{color:var(--ink)}
.box{border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px}
.basis{background:var(--warn)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.col{border-top:4px solid var(--c);background:var(--cb);border-radius:8px;padding:8px 12px}
.col h4{margin:0 0 4px;font-size:13px;color:var(--c)}
.col ul{margin:0;padding-left:18px}
.col li{margin:3px 0;position:relative}
.kpi-line{font-size:13.5px;color:var(--sub);margin-top:8px}
.del{border:none;background:none;color:var(--bad);padding:0 4px;font-size:15px;opacity:.5}
.del:hover{opacity:1}
.add{font-size:12px;margin-top:4px;color:var(--sub)}
.note li{margin:4px 0}
[contenteditable="true"]{outline:none;border-radius:4px;transition:background .15s}
body.editing [contenteditable="true"]:hover{background:rgba(31,79,216,.07)}
body.editing [contenteditable="true"]:focus{background:rgba(31,79,216,.13);box-shadow:0 0 0 2px var(--brand)}
body:not(.editing) .del,body:not(.editing) .add{display:none}
@media (max-width:820px){.layout{grid-template-columns:1fr}nav.side{display:none}}
@media print{header.top,nav.side{display:none}.layout{display:block;padding:0}.card,.tw{break-inside:avoid}body{background:#fff}}
</style>
</head>
<body class="editing">
<header class="top">
  <h1>부서별 수익증대 실행계획 · 2026 건강보험 수가 구조혁신 대응</h1>
  <div class="tools">
    <button id="btnLock">편집 잠금</button>
    <button class="primary" id="btnSave">수정본 HTML 저장</button>
    <button id="btnPrint">인쇄/PDF</button>
    <button id="btnReset">원본으로 초기화</button>
  </div>
</header>
<div class="layout">
  <nav class="side" id="nav"></nav>
  <main id="app" data-ts="0"></main>
</div>

{id:"won",name:"원무과",tag:"외래·접수",A:100,e:[120,130,110],

    ["인력 충원 효과(수가·성과보상) 추적","재활·영상 전문 인력 확보","이직률 관리"]],
 kpi:"신고 정확도 / 충원 소요일 / 교육 이수율"},
{id:"pr",name:"홍보팀",tag:"유입·인지",A:40,e:[50,50,40],
 basis:"지역 종합병원의 진료·입원·수술·응급·재활 연계와 치료 완결성 중심 홍보 (원본 보고서)",
 s:[["상급병원 치료 후 본원 전원 환자 사례·실적 콘텐츠","응급실 이용 안내 영상 제작","홈페이지에 심층진찰·재활·응급 안내 개편"],
    ["진료→입원→수술→재활 치료과정 중심 콘텐츠로 전환","환자 인터뷰 영상","검진·재활 비급여 상품 홍보 연계"],
    ["유입 경로별 성과 분석(검색·지역·전원)","지역 의원·요양병원 대상 협력 홍보","환자경험 콘텐츠 정례화"]],
 kpi:"신환 수 / 전원 유입 수 / 응급 내원 수 / 콘텐츠 조회수"}
];

/* ===== 유틸 ===== */
function h(t,a,c){var e=document.createElement(t);if(a)for(var k in a)e.setAttribute(k,a[k]);if(c!=null)e.innerHTML=c;return e}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function num(el){var v=parseFloat(String(el.textContent).replace(/[^\d.\-]/g,""));return isNaN(v)?0:v}
function fmt(n){return Math.round(n).toLocaleString("ko-KR")}
function liHtml(t){return '<li><span class="ed" contenteditable="true">'+esc(t)+'</span> <button class="del" data-act="del-li" title="삭제">×</button></li>'}

/* ===== 렌더 ===== */
function render(){
  var html='';
  html+='<section id="overview"><h2 class="ed" contenteditable="true">종합 효과 요약</h2>'+
   '<p class="lead ed" contenteditable="true">원본 보고서(2026.08.07 건강보험 수가 구조혁신 방안 보고회)의 부서별 대응안을, 정책 근거에 맞춰 3단계 실행안으로 확장했습니다. 아래 금액은 가정치이므로 병원 실제 데이터로 바꾸면 모든 합계와 배수가 자동으로 다시 계산됩니다.</p>'+
   '<div class="grid g4">'+
   '<div class="card kpi"><div class="l">기존 보고안 효과 합계 (A)</div><div class="v" id="tA">-</div><div class="l">백만원/연</div></div>'+
   '<div class="card kpi"><div class="l">확장 실행안 효과 합계 (B)</div><div class="v" id="tB">-</div><div class="l">백만원/연</div></div>'+
   '<div class="card kpi"><div class="l">확장 배수 (B÷A)</div><div class="v" id="tM">-</div><div class="l" id="tJ"></div></div>'+
   '<div class="card kpi"><div class="l">목표 배수</div><div class="v"><span class="num ed" id="goal" contenteditable="true">3.0</span>배</div><div class="l">숫자를 고쳐 보세요</div></div>'+
   '</div></section>';
  html+='<section id="policy"><h2>① 국가 정책 근거</h2><p class="lead ed" contenteditable="true">모든 부서 실행안은 아래 정책 항목에 근거합니다. 세부 기준·고시가 확정되기 전 항목은 확정 후 수정해 주세요.</p><div class="grid g3">';
  POLICY.forEach(function(p){html+='<div class="card"><b class="ed" contenteditable="true">'+esc(p[0])+'</b><div class="ed" contenteditable="true" style="color:var(--sub);font-size:14px">'+esc(p[1])+'</div></div>'});
  html+='</div></section>';
  html+='<section id="roadmap"><h2>② 3단계 로드맵</h2><div class="grid g3">';
  STAGES.forEach(function(s){html+='<div class="card stage" style="'+s[3]+'"><h3 class="ed" contenteditable="true">'+esc(s[0])+'</h3><div class="tag ed" contenteditable="true">'+esc(s[1])+'</div><p class="ed" contenteditable="true" style="margin:6px 0 0">'+esc(s[2])+'</p></div>'});
  html+='</div></section>';
  html+='<section id="sim"><h2>③ 부서별 효과 시뮬레이터 (백만원/연, 가정치)</h2><p class="lead ed" contenteditable="true">기존 안(A)과 단계별 추가 효과(1~3단계)를 직접 입력하세요. 배수가 목표 이상이면 초록색으로 표시됩니다.</p>'+
   '<div class="tw"><table id="simT"><thead><tr><th>부서</th><th class="n">기존안 A</th><th class="n">1단계</th><th class="n">2단계</th><th class="n">3단계</th><th class="n">확장안 B</th><th class="n">배수</th><th></th></tr></thead><tbody>';
  D.forEach(function(d){html+=simRow(d.id,d.name,d.A,d.e)});
  html+='</tbody><tfoot><tr><td>합계</td><td class="n" id="fA"></td><td class="n" id="f1"></td><td class="n" id="f2"></td><td class="n" id="f3"></td><td class="n" id="fB"></td><td class="n" id="fM"></td><td></td></tr></tfoot></table></div>'+
   '<div class="add"><button data-act="add-sim">+ 부서 행 추가</button></div></section>';
  html+='<section id="depts"><h2>④ 부서별 단계별 실행방안</h2>';
  D.forEach(function(d){html+=deptCard(d)});
  html+='</section>';
  html+='<section id="notes"><h2>⑤ 가정과 유의사항</h2><div class="card note"><ul class="ed" contenteditable="true">'+
   '<li>금액은 모두 설명을 위한 가정치입니다. 병원의 최근 12개월 청구·검사·병동 실적으로 교체해야 의미가 있습니다.</li>'+
   '<li>수치가 있는 정책 사실(진찰료 2%, 심층진찰 85,720원, 성과보상 5%, 원가보상률 190→150→110%, 위탁의뢰료 25% 등)은 원본 보고서에서 가져왔습니다. 시행 시기와 세부 요건은 심평원 고시 확정 후 확인해야 합니다.</li>'+
   '<li>"3배 이상"은 기존 보고안(A) 대비 확장 실행안(B)의 설계 목표이며, 달성을 보장하는 수치가 아닙니다. 실제 달성 여부는 시뮬레이터에 실측값을 넣어 검증하세요.</li>'+
   '<li>검사 수가 인하(CT·MRI 등)로 줄어드는 수익은 별도로 반영해야 합니다. 영상의학과·진단검사의학과 항목은 손실 방어 효과가 포함된 값입니다.</li>'+
   '<li>일부 부서(수혈관리실, 영양팀, 전산, 재무, 총무, 홍보)는 직접 수가 항목이 없어 누락 방지와 비용 절감 효과 위주로 보수적으로 잡았습니다.</li>'+
   '</ul></div></section>';
  app.innerHTML=html;
  buildNav();
}
function simRow(id,name,A,e){
  return '<tr data-dept="'+id+'"><td class="ed" contenteditable="true">'+esc(name)+'</td>'+
  '<td class="n num ed a" contenteditable="true">'+A+'</td>'+
  '<td class="n num ed s1" contenteditable="true">'+e[0]+'</td>'+
  '<td class="n num ed s2" contenteditable="true">'+e[1]+'</td>'+
  '<td class="n num ed s3" contenteditable="true">'+e[2]+'</td>'+
  '<td class="n b"></td><td class="n m"></td><td><button class="del" data-act="del-row" title="삭제">×</button></td></tr>';
}
function deptCard(d){
  var h='<div class="card dept" id="d-'+d.id+'" data-dept="'+d.id+'"><header><h3 class="ed" contenteditable="true">'+esc(d.name)+'</h3><span class="tag ed" contenteditable="true">'+esc(d.tag)+'</span><span class="eff">기존안 <b class="ea">-</b> → 확장안 <b class="eb">-</b> (<b class="em">-</b>)</span></header>'+
   '<div class="box basis"><b>정책 근거</b> · <span class="ed" contenteditable="true">'+esc(d.basis)+'</span></div><div class="cols">';
  var cls=["--c:var(--s1);--cb:var(--s1b)","--c:var(--s2);--cb:var(--s2b)","--c:var(--s3);--cb:var(--s3b)"];
  var nm=["1단계 · 0~3개월","2단계 · 3~9개월","3단계 · 9~18개월"];
  for(var i=0;i<3;i++){
    h+='<div class="col" style="'+cls[i]+'"><h4 class="ed" contenteditable="true">'+nm[i]+'</h4><ul>'+d.s[i].map(liHtml).join("")+'</ul><button class="add" data-act="add-li">+ 항목 추가</button></div>';
  }
  h+='</div><div class="kpi-line"><b>성과지표(KPI)</b> · <span class="ed" contenteditable="true">'+esc(d.kpi)+'</span></div></div>';
  return h;
}
function buildNav(){
  var n='<div class="grp">개요</div><a href="#overview">종합 요약</a><a href="#policy">정책 근거</a><a href="#roadmap">3단계 로드맵</a><a href="#sim">효과 시뮬레이터</a><div class="grp">부서별</div>';
  D.forEach(function(d){n+='<a href="#d-'+d.id+'">'+d.name+'</a>'});
  n+='<div class="grp">참고</div><a href="#notes">가정·유의사항</a>';
  document.getElementById("nav").innerHTML=n;
}

/* ===== 계산 ===== */
function calc(){
  var goal=num(document.getElementById("goal"))||3;
  var rows=app.querySelectorAll("#simT tbody tr");var T={a:0,s1:0,s2:0,s3:0,b:0};var map={};
  rows.forEach(function(r){
    var a=num(r.querySelector(".a")),s1=num(r.querySelector(".s1")),s2=num(r.querySelector(".s2")),s3=num(r.querySelector(".s3"));
    var b=s1+s2+s3,m=a?b/a:0;
    r.querySelector(".b").textContent=fmt(b);
    var mc=r.querySelector(".m");mc.textContent=a?m.toFixed(1)+"배":"-";mc.className="n m "+(m>=goal?"ok":"bad");
    T.a+=a;T.s1+=s1;T.s2+=s2;T.s3+=s3;T.b+=b;
    map[r.getAttribute("data-dept")]={a:a,b:b,m:m};
  });
  var set=function(id,t){var e=document.getElementById(id);if(e)e.textContent=t};
  set("fA",fmt(T.a));set("f1",fmt(T.s1));set("f2",fmt(T.s2));set("f3",fmt(T.s3));set("fB",fmt(T.b));
  var M=T.a?T.b/T.a:0;set("fM",M.toFixed(2)+"배");
  set("tA",fmt(T.a));set("tB",fmt(T.b));set("tM",M.toFixed(2)+"배");
  var tM=document.getElementById("tM");if(tM)tM.className="v "+(M>=goal?"ok":"bad");
  set("tJ",M>=goal?"목표 "+goal+"배 이상 달성":"목표 "+goal+"배 미달");
  app.querySelectorAll(".dept").forEach(function(c){
    var x=map[c.getAttribute("data-dept")];
    c.querySelector(".ea").textContent=x?fmt(x.a)+"백만원":"-";
    c.querySelector(".eb").textContent=x?fmt(x.b)+"백만원":"-";
    c.querySelector(".em").textContent=x&&x.a?x.m.toFixed(1)+"배":"-";
  });
}

/* ===== 편집/저장 ===== */
var timer;
function autosave(){
  clearTimeout(timer);
  timer=setTimeout(function(){
    try{app.setAttribute("data-ts",String(Date.now()));localStorage.setItem(LS_KEY,JSON.stringify({ts:Date.now(),html:app.innerHTML}))}catch(e){}
  },500);
}
function setEditing(on){
  document.body.classList.toggle("editing",on);
  app.querySelectorAll(".ed").forEach(function(e){e.setAttribute("contenteditable",on?"true":"false")});
  document.getElementById("btnLock").textContent=on?"편집 잠금":"편집 잠금 해제";
}
app.addEventListener("input",function(e){
  if(e.target.classList&&(e.target.classList.contains("num")))calc();
  autosave();
});
app.addEventListener("paste",function(e){
  e.preventDefault();
  var t=(e.clipboardData||window.clipboardData).getData("text/plain");
  document.execCommand("insertText",false,t);
});
app.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("num")){e.preventDefault();e.target.blur()}
});
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.getAttribute("data-act");
  if(act==="del-li"){b.closest("li").remove()}
  else if(act==="del-row"){b.closest("tr").remove()}
  else if(act==="add-li"){
    var ul=b.parentNode.querySelector("ul");ul.insertAdjacentHTML("beforeend",liHtml("새 실행 항목 (담당·기한 포함)"));
    var last=ul.lastElementChild.querySelector(".ed");last.focus();
  }
  else if(act==="add-sim"){
    var id="x"+Date.now();
    app.querySelector("#simT tbody").insertAdjacentHTML("beforeend",simRow(id,"새 부서",0,[0,0,0]));
  }
  calc();autosave();
});
document.getElementById("btnLock").onclick=function(){setEditing(!document.body.classList.contains("editing"))};
document.getElementById("btnPrint").onclick=function(){window.print()};
document.getElementById("btnReset").onclick=function(){
  if(!confirm("저장된 수정 내용을 모두 지우고 원본으로 되돌릴까요?"))return;
  try{localStorage.removeItem(LS_KEY)}catch(e){}
  render();setEditing(true);calc();
};
document.getElementById("btnSave").onclick=function(){
  var ts=Date.now();app.setAttribute("data-ts",String(ts));
  var wasEditing=document.body.classList.contains("editing");
  var html="<!doctype html>\n"+document.documentElement.outerHTML;
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([html],{type:"text/html;charset=utf-8"}));
  var d=new Date();
  a.download="부서별_수익증대_실행계획_수정본_"+d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2)+".html";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
  autosave();
};

/* ===== 시작 ===== */
var hasContent=app.children.length>0;           // 저장된 파일에서 열린 경우
var saved=null;
try{saved=JSON.parse(localStorage.getItem(LS_KEY)||"null")}catch(e){}
if(!hasContent){
  if(saved&&saved.html){app.innerHTML=saved.html;}else{render();}
}else if(saved&&saved.html&&saved.ts>(parseInt(app.getAttribute("data-ts"),10)||0)){
  app.innerHTML=saved.html;
}
if(!document.getElementById("nav").children.length)buildNav();
setEditing(document.body.classList.contains("editing"));
calc();
})();
</script>
</body>
</html>
